[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short -p no:langsmith

# Run adapter+model tests first (XGBoost must load before spaCy on macOS ARM).
# Test files are discovered alphabetically: test_agents < test_ledger < test_mock < test_no_llm < test_redaction.
# The alphabetical order naturally puts test_mock_adapter.py before test_redaction.py — keep it that way.
